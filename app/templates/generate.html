<!-- app/templates/form.html -->

<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyndHound-お喋りする-</title>

  <!-- fabicon -->
  <link rel="icon" type="image/svg+xml" sizes="any" href="/static/images/500icon.svg">
  <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@300;400&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
    rel="stylesheet">

  <!-- normalizecss -->
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
  <!-- tailwindcss -->
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  <!-- css -->
  <link rel="stylesheet" href="../static/style.css">

</head>

<body>
  <div class="header">
    <img class="logo" src="/static/images/MyndHound_logo.svg" alt="logo">

    <ul class="header-menu">
      <li><a href="/" class="dotgothic">覚えさせる</a></li>
      <li><a tabindex="-1" class="dotgothic now-page">お喋りする</a></li>
    </ul>

  </div>

  <div class="container">

    <div id="chat-log">
      {% for log in chatLogs %}
      <div class="log-list">
        <div class="dotgothic user-input">User: {{ log.question }}</div>
        <div class="dotgothic AI-response typewriter" data-text="{{ log.answer }}">{{ log.answer }}</div>
      </div>
      {% endfor %}
    </div>

    <img class="character" id="aiCharacter" src="/static/images/IMG_1317.PNG" alt="">

    <div class="question-form">
      <!-- <div class="question-section" type="hidden">
        <p class="dotgothic question-container ">{{ question }}</p>
      </div> -->

      <div class="answer-section">
        <form id="teachAI-form" method="post" action="/generate">
          <input type="hidden" name="session_id" value="{{ session_id }}">

          <div class="form-container">
            <textarea id="messageInput" name="question" placeholder="質問をしてみよう！"
              class="dotgothic form-textarea">{{ answer or "" }}</textarea>

            <div class="textarea-under">
              <p class="dotgothic warning">一日経つと昨日教えたことを学習します。毎日見にきてみてください！</p>
              <button type="submit" class="form-button"><img src="/static/images/submitbutton.svg"
                  alt="submit"></button>
            </div>

          </div>
        </form>

      </div>

    </div>





  </div>

  <script>

    // ページ読み込み時にスクロールを一番下にする
    document.addEventListener("DOMContentLoaded", () => {
      const chatContainer = document.getElementById("chat-log");
      if (chatContainer) {
        // スクロールを一番下にする
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });

    function typeWriterEffect(el, text, delay = 30) {
      el.textContent = "";
      let i = 0;

      const interval = setInterval(() => {
        el.textContent += text[i];
        i++;
        if (i >= text.length) {
          clearInterval(interval);
          stopTalking();
        }
      }, delay);
    }

    // キャラクター待機モーション、尻尾振り
    const imagePaths = [
      "/static/images/IMG_1317.PNG",
      "/static/images/IMG_1326.png",
    ];

    let currentIndex = 0;
    const imageElement = document.getElementById("aiCharacter");

    setInterval(() => {
      currentIndex = (currentIndex + 1) % imagePaths.length;
      imageElement.src = imagePaths[currentIndex];
    }, 1000); // 1000ミリ秒 = 1秒

    // キャラクターのアニメーション
    // 話す時
    function startTalking() {
      const char = document.getElementById("aiCharacter");
      if (char) char.classList.add("talking");
    }

    function stopTalking() {
      const char = document.getElementById("aiCharacter");
      if (char) char.classList.remove("talking");
    }

    // ページ読み込み時に最後のレスポンスをタイプライター効果で表示
    document.addEventListener("DOMContentLoaded", () => {
      const responses = document.querySelectorAll(".typewriter");
      if (responses.length > 0) {
        const last = responses[responses.length - 1];
        const text = last.dataset.text;
        startTalking();
        typeWriterEffect(last, text);
      }
      // スクロールを一番下にする
      const chatContainer = document.getElementById("chat-log");
      if (chatContainer) {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });

    // Enterで送信する
    const textarea = document.getElementById("messageInput");

    textarea.addEventListener("keydown", function (e) {
      // Shift+Enter なら改行
      if (e.key === "Enter" && e.shiftKey) return;

      // Enterのみ（送信処理）
      if (e.key === "Enter") {
        e.preventDefault(); // 改行キャンセル

        // 空かどうかチェック（空白だけも除外）
        const text = this.value.trim();
        if (text === "") {
          // 必要なら警告表示もできるよ
          alert("テキストを入力してください！");
          return;
        }

        this.form.submit();
      }
    });


  </script>

</body>

</html>
