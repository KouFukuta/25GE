<!-- app/templates/form.html -->

<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyndHound-お喋りする-</title>

  <!-- fabicon -->
  <link rel="icon" type="image/svg+xml" sizes="any" href="/static/images/500icon.svg">
  <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@300;400&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
    rel="stylesheet">

  <!-- normalizecss -->
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
  <!-- tailwindcss -->
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  <!-- css -->
  <link rel="stylesheet" href="../static/style.css">

</head>

<body>
  <div class="header">
    <img class="logo" src="/static/images/MyndHound_logo.svg" alt="logo">

    <ul class="header-menu">
      <li><a href="/" class="dotgothic">覚えさせる</a></li>
      <li><a tabindex="-1" class="dotgothic now-page">お喋りする</a></li>
    </ul>

  </div>

  <div class="container">

    <div id="chat-log">
      {% for log in chatLogs %}
      <div class="log-list">
        <div class="dotgothic user-input">User: {{ log.question }}</div>
        <div class="dotgothic AI-response typewriter" data-text="{{ log.answer }}">{{ log.answer }}</div>
      </div>
      {% endfor %}
    </div>

    <img class="character" id="aiCharacter" src="/static/images/IMG_1317.PNG" alt="">

    <div class="question-form">
      <!-- <div class="question-section" type="hidden">
        <p class="dotgothic question-container ">{{ question }}</p>
      </div> -->

      <div class="answer-section">
        <form id="teachAI-form" method="post" action="/generate">
          <input type="hidden" name="session_id" value="{{ session_id }}">

          <div class="form-container">
            <textarea id="messageInput" name="question" placeholder="質問をしてみよう！"
              class="dotgothic form-textarea">{{ answer or "" }}</textarea>

            <div class="textarea-under">
              <p class="dotgothic warning">一日経つと昨日教えたことを学習します。毎日見にきてみてください！</p>
              <button type="submit" class="form-button form-submit" disabled><img src="/static/images/submitbutton.svg"
                  alt="submit"></button>
            </div>

          </div>
        </form>

      </div>

    </div>





  </div>

  <script>
    const form = document.getElementById("teachAI-form");
    const textarea = document.getElementById("messageInput");
    const submitBtn = form.querySelector(".form-submit");

    // 入力が空なら送信ボタンを無効化
    function toggleSubmitButton() {
      const text = textarea.value.trim();
      submitBtn.disabled = text === "";
    }

    // 入力中のイベントでボタン状態を切り替え
    textarea.addEventListener("input", toggleSubmitButton);

    // フォーム送信時チェック（空ならキャンセル）
    form.addEventListener("submit", function (e) {
      const text = textarea.value.trim();
      if (text === "") {
        e.preventDefault(); // 送信キャンセル
        submitBtn.disabled = true;
      }
    });

    // Enterで送信（Shift+Enterは改行）
    textarea.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault(); // 改行キャンセル
        const text = textarea.value.trim();
        if (text !== "") {
          form.requestSubmit();
        }
      }
    });

    // 初期状態でチェックしておく
    document.addEventListener("DOMContentLoaded", toggleSubmitButton);

  </script>

</body>

</html>
