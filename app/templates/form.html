<!-- app/templates/form.html -->

<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyndHound-覚えさせる-</title>

  <!-- fabicon -->
  <link rel="icon" type="image/svg+xml" sizes="any" href="/static/images/500icon.svg">
  <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@300;400&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
    rel="stylesheet">

  <!-- normalizecss -->
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
  <!-- tailwindcss -->
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  <!-- css -->
  <link rel="stylesheet" href="../static/style.css">

</head>

<body>
  <div class="header">
    <img class="logo" src="/static/images/MyndHound_logo.svg" alt="logo">

    <ul class="header-menu">
      <li><a tabindex="-1" class="dotgothic now-page">覚えさせる</a></li>
      <li><a href="/generate" class="dotgothic">お喋りする</a></li>
    </ul>

  </div>

  <div class="container">

    <div id="chat-log">
      {% for log in chatLogs %}
      <div class="log-list">
        {% if loop.index0 == 0 %}
        <!-- 最初のログだけ質問も表示 -->
        <div class="dotgothic AI-response">{{ log.question }}</div>
        {% endif %}
        <div class="dotgothic user-input">User: {{ log.answer }}</div>
        <div class="dotgothic AI-response typewriter" data-text="{{ log.response }}">{{ log.response }}</div>
      </div>
      {% endfor %}
    </div>

    <img class="character" id="aiCharacter" src="/static/images/IMG_1317.png" alt="">

    <div class="question-form">
      <div class="question-section">
        <p class="dotgothic question-container ">{{ question }}</p>
      </div>

      <div class="answer-section">
        <form id="teachAI-form" method="post" action="/">
          <input type="hidden" name="session_id" value="{{ session_id }}">
          <input type="hidden" name="question" value="{{ question }}">

          <div class="form-container">
            <textarea id="messageInput" name="answer" placeholder="質問に答えてみよう！"
              class="dotgothic form-textarea">{{ answer or "" }}</textarea>

            <div class="textarea-under">
              <p class="dotgothic warning">※個人情報などを含む内容は送信しないでください。AIが学習してしまい、全ユーザーに公開される恐れがあります。</p>

              <div class="button-container">
                <!-- 送信ボタン -->
                <button type="submit" class="form-submit form-button"><img src="/static/images/submitbutton.SVG"
                    alt="submit"></button>
              </div>

            </div>

          </div>

        </form>

        <!-- 質問再生成ボタン -->
        <form id="reGenerate-form" action="/reGenerate" method="post">
          <input type="hidden" name="session_id" value="{{ session_id }}">
          <button type="submit" class="form-button reGenerate-position" formaction="/reGenerate"><img src="/static/images/reload_icon.SVG"
              alt="reload"></button>
        </form>

      </div>

    </div>

  </div>

  <script>

    // ページ読み込み時にスクロールを一番下にする
    document.addEventListener("DOMContentLoaded", () => {
      const chatContainer = document.getElementById("chat-log");
      if (chatContainer) {
        // スクロールを一番下にする
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });

    function typeWriterEffect(el, text, delay = 30) {
      el.textContent = "";
      let i = 0;

      const interval = setInterval(() => {
        el.textContent += text[i];
        i++;
        if (i >= text.length) {
          clearInterval(interval);
          stopTalking();
        }
      }, delay);
    }

    // キャラクター待機モーション、尻尾振り
    const imagePaths = [
      "/static/images/IMG_1317.png",
      "/static/images/IMG_1326.PNG",
    ];

    let currentIndex = 0;
    const imageElement = document.getElementById("aiCharacter");

    setInterval(() => {
      currentIndex = (currentIndex + 1) % imagePaths.length;
      imageElement.src = imagePaths[currentIndex];
    }, 1000); // 1000ミリ秒 = 1秒

    // キャラクターのアニメーション
    // 話す時
    function startTalking() {
      const char = document.getElementById("aiCharacter");
      if (char) char.classList.add("talking");
    }

    function stopTalking() {
      const char = document.getElementById("aiCharacter");
      if (char) char.classList.remove("talking");
    }

    // ページ読み込み時に最後のレスポンスをタイプライター効果で表示
    document.addEventListener("DOMContentLoaded", () => {
      const responses = document.querySelectorAll(".typewriter");
      if (responses.length > 0) {
        const last = responses[responses.length - 1];
        const text = last.dataset.text;
        startTalking();
        typeWriterEffect(last, text);
      }
      // スクロールを一番下にする
      const chatContainer = document.getElementById("chat-log");
      if (chatContainer) {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });

    const form = document.getElementById("teachAI-form");
    const textarea = document.getElementById("messageInput");

    // フォーム送信時の共通チェック（Enterでもボタンクリックでも対応）
    form.addEventListener("submit", function (e) {
      const text = textarea.value.trim();
      if (text === "") {
        alert("テキストを入力してください！");
        e.preventDefault();  // 送信キャンセル
      }
    });

    // Enterキー送信の処理（すでにあるやつにsubmit外してOK）
    textarea.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();  // 改行キャンセル
        form.requestSubmit(); // フォーム送信を明示的に呼ぶ
      }
    });



  </script>

</body>

</html>
